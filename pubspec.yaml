name: flare_push
description: Flutter client for Flare, a self-hosted push notification service. Uses Firebase Cloud Messaging on Android and Apple push on iOS, with no Firebase setup inside your app.
version: 0.5.0
repository: https://github.com/pulloxz/flare_push

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flare.flare_push
        pluginClass: FlarePushPlugin
      ios:
        pluginClass: FlarePushPlugin
